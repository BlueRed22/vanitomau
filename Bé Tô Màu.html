<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Tô Màu</title>
<style>
:root{--bg:#fff4e6;--pn:#fff;--ink:#3a2e39;--mut:#8b7d8a;--ln:#f0dfc8;--acc:#ff5a7a;--ac2:#ffb703;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1822;--pn:#2a2330;--ink:#f3eaf5;--mut:#a698ab;--ln:#3d3346}}
:root[data-theme="dark"]{--bg:#1d1822;--pn:#2a2330;--ink:#f3eaf5;--mut:#a698ab;--ln:#3d3346}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--pn);border-bottom:2px solid var(--ln);flex-wrap:wrap}
h1{font-size:1.15rem;color:var(--acc);white-space:nowrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;font-size:.85rem;font-weight:600;border:2px solid var(--ln);background:var(--pn);color:var(--ink);border-radius:12px;padding:6px 11px;cursor:pointer;transition:.15s}
button:hover,.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}
main{flex:1;display:flex;gap:12px;padding:12px;min-height:0}
aside{width:290px;flex-shrink:0;background:var(--pn);border:2px solid var(--ln);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:5px}
.tab{font-size:.75rem;padding:4px 9px;border-radius:99px}
.tab.on{background:var(--ac2);border-color:var(--ac2);color:#2a1d00}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;overflow-y:auto;align-content:start;padding:4px}
.sw{aspect-ratio:1;border-radius:14px;cursor:pointer;border:3px solid var(--pn);box-shadow:0 0 0 1px var(--ln),0 2px 5px rgba(0,0,0,.15);transition:.12s}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 3px var(--ink),0 3px 8px rgba(0,0,0,.3);transform:scale(1.1)}
section{flex:1;display:flex;flex-direction:column;min-width:0;gap:10px}
#stage{flex:1;overflow:auto;display:flex;background:repeating-conic-gradient(var(--ln) 0 25%,transparent 0 50%) 0 0/20px 20px;border:2px solid var(--ln);border-radius:18px;min-height:0}
#box{position:relative;margin:auto;flex-shrink:0;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.2);border-radius:6px}
#box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#line{pointer-events:none}
#paint{cursor:crosshair}
.bar{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--pn);border:2px solid var(--ln);border-radius:99px;padding:6px 14px;flex-wrap:wrap;align-self:center;max-width:100%}
.bar button{width:40px;height:40px;border-radius:50%;padding:0;font-size:1.1rem}
.bar button.on{background:var(--ac2);border-color:var(--ac2)}
.dv{width:2px;height:24px;background:var(--ln)}
#prev{width:36px;height:36px;border-radius:10px;border:2px solid var(--ln)}
input[type=color]{width:36px;height:36px;border:none;background:none;cursor:pointer}
input[type=range]{width:90px;accent-color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--pn);border-radius:20px;padding:16px;max-width:620px;width:100%;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:12px}
#thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
#thumbs button{padding:6px;background:#fff;border-radius:14px}
#thumbs img{width:100%;display:block}
#thumbs span{display:block;color:#3a2e39;font-size:.8rem}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:700;z-index:12;opacity:0;transition:.3s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
select{font:inherit;font-size:.8rem;border:2px solid var(--ln);background:var(--pn);color:var(--ink);border-radius:10px;padding:5px}
.stat{font-size:.85rem;font-weight:700;color:var(--mut)}
@media print{body>*{display:none!important}#pimg{display:block!important;width:100%}}
@media (max-width:820px){main{flex-direction:column-reverse;padding:8px}aside{width:100%;max-height:34%}#grid{grid-template-columns:repeat(8,1fr)}input[type=range]{width:70px}}

body{font-size:18px}
header button,header .btn,header select{font-size:1.05rem;padding:10px 14px}
h1{font-size:1.5rem}
.stat{font-size:1rem}
#grid{display:block;overflow-y:auto;flex:1;position:relative;padding:4px;min-height:0}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.ph{font-size:1.15rem;margin:12px 2px 6px;color:var(--ink)}
.sub{font-weight:700;font-size:.95rem;color:var(--mut);margin:6px 2px}
.sw i{font-size:.85rem;font-style:normal;font-weight:800;color:#333;display:flex;align-items:center;justify-content:center;height:100%}
.tab{font-size:1.5rem;padding:4px 9px;border-radius:14px;line-height:1.2}
.bar{gap:8px}
.bar button{width:auto;height:auto;min-width:68px;border-radius:18px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1rem}
.bar button b{font-size:1.8rem;line-height:1.1}
.bar button small{font-size:.85rem;font-weight:700}
.szl{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.85rem}
#prev{width:52px;height:52px}
input[type=color]{width:52px;height:52px}
.sl{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.sl input{flex:1}
.big{font-size:1.2rem;padding:12px}
@media (min-width:821px){aside{width:340px}}
@media (max-width:820px){.g{grid-template-columns:repeat(6,1fr)}aside{max-height:42%}.bar button{min-width:58px}}

main{padding:8px;gap:10px}
section{flex:1;min-width:0}
.fab{display:none}
.bar{display:grid;grid-template-columns:repeat(2,84px);gap:8px;align-content:start;padding:10px;border-radius:22px;overflow-y:auto;flex-shrink:0;align-self:stretch;max-width:none;flex-wrap:nowrap}
.bar button{min-width:0;width:100%}
.bar .dv{grid-column:1/-1;width:auto;height:2px}
.bar .szl,.bar select,.bar #prev,.bar input[type=color]{grid-column:1/-1;width:100%}
.bar input[type=range]{width:100%}
.bar #prev,.bar input[type=color]{height:48px}
@media (min-width:981px){aside{width:320px}}
@media (max-width:980px){
  header{padding:6px 10px}h1{font-size:1.2rem}
  .btns{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px}
  .btns>*{flex-shrink:0;white-space:nowrap}
  main{padding:6px}
  aside{position:fixed;left:0;right:0;bottom:0;width:100%;height:48%;max-height:none;z-index:8;transform:translateY(105%);transition:transform .25s;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
  aside.open{transform:none}
  #grid{padding-bottom:96px}
  .bar{position:fixed;right:8px;top:70px;bottom:100px;z-index:8;transform:translateX(125%);transition:transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.35);align-self:auto}
  .bar.open{transform:none}
  .fab{display:flex;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;z-index:9;flex-direction:column;align-items:center;justify-content:center;width:76px;height:76px;border-radius:50%;padding:0;background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .fab b{font-size:2rem;line-height:1}
  .fab small{font-size:.75rem}
  .fab.r{left:auto;right:14px;background:var(--ac2);border-color:var(--ac2);color:#2a1d00}
  .g{grid-template-columns:repeat(5,1fr)}
  
  /* Mobile: Dàn hàng ngang 3 nút công cụ vẽ ở giữa 2 nút FAB */
  #mobile-tools {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 9;
    background: var(--pn);
    padding: 6px 12px;
    border-radius: 99px;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    border: 2px solid var(--ln);
  }
  #mobile-tools button {
    width: 52px; height: 52px; border-radius: 50%; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--pn); border: 2px solid var(--ln); color: var(--ink);
  }
  #mobile-tools button.on { background: var(--ac2); border-color: var(--ac2); }
  #mobile-tools button b { font-size: 1.4rem; line-height: 1; }
  #mobile-tools button small { font-size: 0.6rem; font-weight: 700; margin-top: 2px; }
}

/* PC: Ẩn thanh mobile-tools vì đã có nút trong hộp công cụ */
@media (min-width:981px){
  #mobile-tools{display:none!important}
}
</style>
</head>
<body>
<header>
  <h1>🎨 Bé Tô Màu</h1><span class="stat" id="stat"></span>
  <div class="btns">
    <button onclick="openGal()">🖼️ Thư viện</button>
    <label class="btn pri">📤 Tải ảnh<input type="file" id="up" accept="image/*" hidden></label>
    <button onclick="reset()">🗑️ Xóa hết</button>
    <button onclick="save()">💾 Lưu</button>
    <button onclick="$('#mk').hidden=false">📷 Ảnh→tranh</button>
    <button onclick="daily()">📅 Hôm nay</button>
    <button onclick="share()">🔗 Chia sẻ</button>
    <button onclick="replay()">🎬 Phát lại</button>
    <button onclick="doPrint()">🖨️ In</button>
    <select id="lim" title="Giới hạn thời gian (phụ huynh)"><option value="0">⏱ Không giới hạn</option><option value="10">10 phút</option><option value="20">20 phút</option><option value="30">30 phút</option></select>
  </div>
</header>
<main>
  <aside id="pal"><div id="tabs"></div><div id="grid"></div></aside>
  <section>
    <div id="stage"><div id="box"><canvas id="paint"></canvas><canvas id="line"></canvas></div></div>
  </section>
  <div class="bar" id="bar">
      <!-- MỚI: 3 nút công cụ được đưa vào đây cho PC -->
      <div class="dv" style="grid-column:1/-1; width:100%"></div>
      <div style="grid-column:1/-1; display:flex; gap:6px; width:100%">
        <button id="t-fill" class="on" onclick="setTool('fill')" style="flex:1"><b>🪣</b><small>Đổ màu</small></button>
        <button id="t-brush" onclick="setTool('brush')" style="flex:1"><b>🖌️</b><small>Bút vẽ</small></button>
        <button id="t-eraser" onclick="setTool('eraser')" style="flex:1"><b>🧽</b><small>Tẩy</small></button>
      </div>
      <div class="dv" style="grid-column:1/-1; width:100%"></div>

      <label class="szl">Nét to<input type="range" id="size" min="4" max="60" value="16"></label>
      <select id="fx" title="Hiệu ứng bút"><option value="n">Bút thường</option><option value="r">🌈 Cầu vồng</option><option value="g">✨ Kim tuyến</option></select>
      <div class="dv"></div>
      <button onclick="zoom(1.2)"><b>➕</b></button>
      <button onclick="zoom(1/1.2)"><b>➖</b></button>
      <button onclick="fit()"><b>⤢</b><small>Vừa khung</small></button>
      <button onclick="undo()"><b>↩️</b><small>hoàn tác</small></button>
      <div class="dv"></div>
      <button onclick="magic()"><b>🎲</b><small>Màu ngẫu nhiên</small></button>
      <button id="snd" onclick="toggleSnd()"><b>🔊</b><small>Sound</small></button>
      <div id="prev"></div>
      <input type="color" id="pick" value="#ff5a7a" title="Tự chọn màu">
      
      <!-- MỚI: Mục cài đặt con trỏ -->
      <div class="dv"></div>
      <div class="szl" style="grid-column:1/-1; width:100%">Con trỏ chuột</div>
      <div style="grid-column:1/-1; display:flex; flex-direction:column; gap:4px; width:100%">
        <input type="text" id="curBrushUrl" placeholder="Link ảnh bút (PNG)" style="width:100%; padding:6px; border-radius:8px; border:1px solid var(--ln); font-size:0.8rem">
        <input type="text" id="curEraserUrl" placeholder="Link ảnh tẩy (PNG)" style="width:100%; padding:6px; border-radius:8px; border:1px solid var(--ln); font-size:0.8rem">
        <button onclick="applyCursor()" style="font-size:0.8rem; padding:4px; width:100%">Áp dụng con trỏ</button>
      </div>
  </div>
</main>

<!-- CÁC NÚT ĐIỀU KHIỂN CHÍNH -->
<button class="fab" onclick="togglePanel('pal')"><b>🎨</b><small>Màu</small></button>

<!-- Thanh công cụ vẽ dàn hàng ngang trên mobile (sẽ bị ẩn trên PC) -->
<div id="mobile-tools">
  <button id="mt-fill" class="on" onclick="setTool('fill')"><b>🪣</b><small>Đổ màu</small></button>
  <button id="mt-brush" onclick="setTool('brush')"><b>🖌️</b><small>Bút vẽ</small></button>
  <button id="mt-eraser" onclick="setTool('eraser')"><b>🧽</b><small>Tẩy</small></button>
</div>

<button class="fab r" onclick="togglePanel('bar')"><b>🧰</b><small>Công cụ</small></button>

<div class="modal" id="gal" hidden><div class="mbox"><b>Chọn tranh để tô</b><div id="thumbs"></div><button onclick="$('#gal').hidden=true">Đóng</button></div></div>
<div class="modal" id="lock" hidden><div class="mbox"><b>⏰ Hết giờ tô màu rồi!</b><span>Bé nghỉ ngơi một chút nhé.</span><button class="pri" onclick="unlock()">Phụ huynh: cho tô thêm 10 phút</button></div></div>
<div class="modal" id="mk" hidden><div class="mbox"><b style="font-size:1.3rem">📷 Ảnh thật → tranh tô màu</b>
<input type="file" id="photo" accept="image/*" hidden>
<button class="pri big" onclick="$('#photo').click()">📁 Chọn ảnh</button>
<canvas id="phc" style="display:none;width:100%;height:260px;object-fit:contain;background:#fff;border-radius:12px;border:2px solid var(--ln)"></canvas>
<label class="sl">🔍 Chi tiết <input type="range" data-k="dt" min="1" max="10" value="6"></label>
<label class="sl">✏️ Nét dày <input type="range" data-k="th" min="0" max="8" value="2"></label>
<label class="sl">🔗 Nối nét liền <input type="range" data-k="cl" min="0" max="4" value="2"></label>
<label class="sl">🧹 Lọc chấm nhiễu <input type="range" data-k="sp" min="0" max="300" value="40"></label>
<label class="sl">🌫️ Làm mịn <input type="range" data-k="sm" min="0" max="3" value="1"></label>
<button class="pri big" onclick="phUse()">✅ Dùng tranh này</button>
<span id="mks" class="stat"></span>
<button class="big" onclick="$('#mk').hidden=true">Đóng</button></div></div>
<div id="toast"></div><img id="pimg" alt="" style="display:none">
<script>
const $=s=>document.querySelector(s);
const paint=$('#paint'),line=$('#line'),pc=paint.getContext('2d',{willReadFrequently:true}),lc=line.getContext('2d',{willReadFrequently:true});
const box=$('#box'),stage=$('#stage');
let W=1000,H=1000,tool='fill',size=16,scale=1,hist=[],wall=null,ready=false,baseC='#ff5a7a',cur={t:'s',c:baseC};

/* Xử lý con trỏ chuột tùy chỉnh */
const LS_CURSOR = 'btm-cursors';
let cursors = { brush: '', eraser: '' };

function loadCursors() {
    try {
        const saved = JSON.parse(localStorage.getItem(LS_CURSOR));
        if(saved) cursors = saved;
    } catch(e) {}
    $('#curBrushUrl').value = cursors.brush || '';
    $('#curEraserUrl').value = cursors.eraser || '';
    applyCursor();
}

function applyCursor() {
    cursors.brush = $('#curBrushUrl').value.trim();
    cursors.eraser = $('#curEraserUrl').value.trim();
    localStorage.setItem(LS_CURSOR, JSON.stringify(cursors));
    
    const hotspot = '4 4';
    
    if (tool === 'brush' && cursors.brush) {
        paint.style.cursor = `url('${cursors.brush}') ${hotspot}, crosshair`;
    } else if (tool === 'eraser' && cursors.eraser) {
        paint.style.cursor = `url('${cursors.eraser}') ${hotspot}, cell`;
    } else {
        paint.style.cursor = tool === 'fill' ? 'crosshair' : 'default';
    }
    toast('Đã áp dụng con trỏ!');
}

function setTool(t) {
    tool = t;
    ['fill','brush','eraser'].forEach(x=>{
        $('#t-'+x)?.classList.toggle('on',x===t);
        $('#mt-'+x)?.classList.toggle('on',x===t);
    });
    applyCursor();
}

/* ---------- Bảng màu ---------- */
const P={
'🎨 Cơ bản':'ff4757 ff7f50 ffa502 ffd32a 7bed9f 2ed573 1e90ff 3742fa a55eea ff6b81 8b5a2b 57606f 2f3542 a4b0be f1f2f6 000000',
'🌈 Cầu vồng':'e40303 ff8c00 ffed00 008026 004dff 750787 ff69b4 00ced1 ff5e5e ffc93c 6bcb77 4d96ff',
'🍬 Kẹo ngọt':'ffb3c6 ffc8dd ffafcc bde0fe a2d2ff cdb4db b5ead7 c7f9cc ffdab9 fdffb6 caffbf 9bf6ff',

'🌊 Đại dương':'03045e 023e8a 0077b6 0096c7 00b4d8 48cae4 90e0ef ade8f4 caf0f8 2a9d8f 264653 e9f5f2',
'🌅 Hoàng hôn':'355c7d 6c5b7b c06c84 f67280 f8b195 ffd6a5 ff6f61 ffa07a ffb347 ffcc5c 9d4edd 5a189a',
'🧑 Da & tóc':'ffe0bd ffcd94 eac086 d2a679 c68642 a1665e 8d5524 5c3a21 f4c2a1 f5deb3 3b2f2f c0c0c0',
'🍂 Đất & gỗ':'d7ccc8 bcaaa4 a1887f 8d6e63 6d4c41 5d4037 4e342e 3e2723 deb887 cd853f d2691e 8b4513',
'🌸 Phấn hoa':'ffcdd2 f8bbd0 e1bee7 d1c4e9 c5cae9 bbdefb b2dfdb c8e6c9 fff9c4 ffe0b2 ffccbc d7ccc8',
'✨ Ánh kim':'ffd700 e6b800 c0c0c0 b87333 cd7f32 e5e4e2 b08d57 d4af37 aaa9ad 8c7853 f7e7ce 7b6d8d'};
for(const k in P)P[k]=P[k].split(' ').map(h=>'#'+h);
const GR=[['#ff9a9e','#fecfef'],['#ffecd2','#fcb69f'],['#a18cd1','#fbc2eb'],['#84fab0','#8fd3f4'],['#f6d365','#fda085'],['#4facfe','#00f2fe'],['#fa709a','#fee140'],['#667eea','#764ba2'],['#ff0844','#ffb199'],['#43e97b','#38f9d7'],['#f093fb','#f5576c'],['#30cfd0','#330867']];
const PAT=[
(g,s)=>g.fillRect(0,0,s,s/2),
(g,s)=>{g.lineWidth=5;g.beginPath();g.moveTo(0,s);g.lineTo(s,0);g.moveTo(-s/2,s/2);g.lineTo(s/2,-s/2);g.moveTo(s/2,s*1.5);g.lineTo(s*1.5,s/2);g.stroke()},
(g,s)=>{g.beginPath();g.arc(s/2,s/2,5.5,0,7);g.fill()},
(g,s)=>{g.fillRect(0,0,s/2,s/2);g.fillRect(s/2,s/2,s/2,s/2)},
(g,s)=>{g.lineWidth=3;g.beginPath();g.moveTo(0,s*.7);g.lineTo(s/4,s*.3);g.lineTo(s/2,s*.7);g.lineTo(s*.75,s*.3);g.lineTo(s,s*.7);g.stroke()},
(g,s)=>{g.font='20px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('♥',s/2,s/2+1)},
(g,s)=>{g.font='22px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('★',s/2,s/2+1)},

  const k=1000/Math.max(im.width,im.height);W=Math.round(im.width*k);H=Math.round(im.height*k);

  for(let i=0,p=0;i<d.length;i+=4,p++){const l=.3*d[i]+.59*d[i+1]+.11*d[i+2],a=l<110?255:l>225?0:(225-l)*255/115;o.data[i]=o.data[i+1]=o.data[i+2]=30;o.data[i+3]=a;wall[p]=a>=170}
  lc.putImageData(o,0,0);pc.fillStyle='#fff';pc.fillRect(0,0,W,H);hist=[];snap();if(pend){const pi=new Image();pi.onload=()=>{pc.drawImage(pi,0,0);snap()};pi.src=pend;pend=null}ready=true;fit()};

function style(g,b){
  if(cur.t=='s')return cur.c;
  if(cur.t=='g'){const l=g.createLinearGradient(b?b[0]:0,b?b[1]:0,b?b[2]:W,b?b[3]:H);l.addColorStop(0,cur.a);l.addColorStop(1,cur.b);return l}
  return g.createPattern(tile(cur.i,cur.fg,cur.bg,40),'repeat')}
function fill(x,y){
  if(wall[y*W+x])return;
  const seen=new Uint8Array(W*H),st=[y*W+x],px=[];seen[st[0]]=1;let x0=W,y0=H,x1=0,y1=0;
  while(st.length){const p=st.pop();px.push(p);const cx=p%W,cy=(p-cx)/W;
    if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy;
    for(const q of[cx>0?p-1:-1,cx<W-1?p+1:-1,cy>0?p-W:-1,cy<H-1?p+W:-1])if(q>=0&&!seen[q]&&!wall[q]){seen[q]=1;st.push(q)}}
  const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');
  g.fillStyle=style(g,[x0,y0,x1,y1]);g.fillRect(0,0,W,H);
  const s=g.getImageData(0,0,W,H).data,id=pc.getImageData(0,0,W,H),d=id.data;
  for(const p of px){const i=p*4;d[i]=s[i];d[i+1]=s[i+1];d[i+2]=s[i+2];d[i+3]=255}
  pc.putImageData(id,0,0);snap()}

/* Phát lại quá trình tô thành video */
async function replay(){
  const list=ops.filter(o=>o.k!='m');if(!ready||replaying)return;if(!list.length)return toast('Bé chưa tô gì cả!');
  const keep=pc.getImageData(0,0,W,H),sv={cur,baseC,size,tool,bs},rec=document.createElement('canvas');rec.width=W;rec.height=H;const rg=rec.getContext('2d');
  const mime=['video/webm;codecs=vp9','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));let mr,chunks=[];
  if(mime){mr=new MediaRecorder(rec.captureStream(30),{mimeType:mime,videoBitsPerSecond:3e6});mr.ondataavailable=e=>chunks.push(e.data);mr.start()}
  replaying=true;ready=false;pc.fillStyle='#fff';pc.fillRect(0,0,W,H);toast('🎬 Đang phát lại...');
  try{await new Promise(res=>{let i=0;const memo={};const step=()=>{let n=0,slow=0;
    while(i<list.length&&n<30){const o=list[i++];cur=o.c;baseC=o.base;
      if(o.k=='f'){_fill(o.x,o.y);n=99;slow=1}
      else{size=o.sz;tool=o.e?'eraser':'brush';const key=JSON.stringify(o.c)+o.base;bs=o.e?'#fff':(memo[key]=memo[key]||style(pc,null));fxStroke(o.a,o.b,o.fx);n+=3}}
    paintTo(rg,true);
    if(i<list.length)slow?setTimeout(step,90):requestAnimationFrame(step);else setTimeout(res,700)};step()});
    if(mr){await new Promise(r=>{mr.onstop=r;mr.stop()});dl(new Blob(chunks,{type:mime}),'be-to-mau.'+(mime.includes('mp4')?'mp4':'webm'));toast('🎬 Đã lưu video!')}
    else toast('Trình duyệt này chưa hỗ trợ quay video')}
  finally{pc.putImageData(keep,0,0);({cur,baseC,size,tool,bs}=sv);replaying=false;ready=true;render()}}

/* Ảnh thật → tranh tô màu (phát hiện nét, chạy ngay trên máy) */
function boxBlur(s,w,h,r){const t=new Float32Array(w*h),o=new Float32Array(w*h),c=(v,m)=>Math.min(m,Math.max(0,v));

  for(let x=0;x<w;x++){let a=0;for(let y=-r;y<=r;y++)a+=t[c(y,h-1)*w+x];for(let y=0;y<h;y++){o[y*w+x]=a/(2*r+1);a+=t[c(y+r+1,h-1)*w+x]-t[c(y-r,h-1)*w+x]}}
  return o}
/* Ảnh thật → tranh tô màu (chỉnh được độ dày, độ liền nét) */
let phImg=null,phT,phCache={};const PH={dt:6,sm:1,cl:2,sp:40,th:2},mks=m=>$('#mks').textContent=m;
function grayAt(wm){if(phCache.im!==phImg)phCache={im:phImg};if(phCache[wm])return phCache[wm];
  const k=wm/Math.max(phImg.width,phImg.height),w=Math.round(phImg.width*k),h=Math.round(phImg.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(phImg,0,0,w,h);const d=g.getImageData(0,0,w,h).data,gr=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)gr[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];return phCache[wm]={w,h,gr}}
const offs=r=>{const a=[];for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.5)a.push([x,y]);return a};
function dilate(m,w,h,r){if(r<1)return m;const o=new Uint8Array(w*h),F=offs(r);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(m[y*w+x])for(const[dx,dy]of F){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<w&&yy>=0&&yy<h)o[yy*w+xx]=1}return o}
function erode(m,w,h,r){if(r<1)return m;const o=new Uint8Array(w*h),F=offs(r);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(m[y*w+x]){let ok=1;for(const[dx,dy]of F){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<w&&yy>=0&&yy<h&&!m[yy*w+xx]){ok=0;break}}o[y*w+x]=ok}return o}
function despeck(m,w,h,min){if(min<2)return;const n=w*h,seen=new Uint8Array(n);
  for(let s=0;s<n;s++){if(!m[s]||seen[s])continue;const st=[s],comp=[s];seen[s]=1;
    while(st.length){const p=st.pop(),x=p%w;for(const q of[x>0?p-1:-1,x<w-1?p+1:-1,p>=w?p-w:-1,p<n-w?p+w:-1])if(q>=0&&m[q]&&!seen[q]){seen[q]=1;st.push(q);comp.push(q)}}
    if(comp.length<min)for(const p of comp)m[p]=0}}
function phMake(wm){const{w,h,gr}=grayAt(wm),f=wm/1000,R=v=>v>0?Math.max(1,Math.round(v*f)):0,n=w*h;
  const sm=R(PH.sm),gs=sm?boxBlur(boxBlur(gr,w,h,sm),w,h,sm):gr,rad=Math.max(3,Math.round(wm/130)),bl=boxBlur(boxBlur(gr,w,h,rad),w,h,rad),T=30-PH.dt*2.5;
  let m=new Uint8Array(n);for(let i=0;i<n;i++)m[i]=bl[i]-gs[i]>T?1:0;
  const c=R(PH.cl);m=erode(dilate(m,w,h,c),w,h,c);despeck(m,w,h,Math.round(PH.sp*f*f));m=dilate(m,w,h,R(PH.th));return{w,h,m}}
function phCanvas(r){const c=document.createElement('canvas');c.width=r.w;c.height=r.h;const g=c.getContext('2d'),o=g.createImageData(r.w,r.h);
  for(let i=0;i<r.w*r.h;i++){const v=r.m[i]?20:255,j=i*4;o.data[j]=o.data[j+1]=o.data[j+2]=v;o.data[j+3]=255}g.putImageData(o,0,0);return c}
function phPreview(){if(!phImg)return;clearTimeout(phT);phT=setTimeout(()=>{const c=phCanvas(phMake(480)),p=$('#phc');p.width=c.width;p.height=c.height;p.getContext('2d').drawImage(c,0,0)},150)}
function phUse(){if(!phImg)return mks('Hãy chọn ảnh trước nhé.');mks('Đang tạo tranh...');setTimeout(()=>{loadArt(phCanvas(phMake(1000)).toDataURL());$('#mk').hidden=true;mks('');toast('✅ Xong rồi! Bé tô thôi')},40)}
document.querySelectorAll('#mk input[type=range]').forEach(r=>r.oninput=()=>{PH[r.dataset.k]=+r.value;phPreview()});
$('#photo').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const fr=new FileReader();fr.onload=x=>{const im=new Image();im.onload=()=>{phImg=im;$('#phc').style.display='block';mks('');phPreview()};im.src=x.target.result};fr.readAsDataURL(f)};

/* Chế độ phụ huynh: giới hạn thời gian */
const lim=$('#lim');
function setLim(){const m=+lim.value;LS.set('lim',lim.value);limEnd=m?Date.now()+m*6e4:0}
lim.onchange=setLim;lim.value=LS.get('lim','0');setLim();
setInterval(()=>{if(limEnd&&Date.now()>limEnd)$('#lock').hidden=false},3000);
function unlock(){if(prompt('Dành cho phụ huynh: 7 + 8 = ?')==='15'){limEnd=Date.now()+10*6e4;$('#lock').hidden=true}}

/* Khởi động: khôi phục tranh đang tô dở (tự lưu) */
/* Bố cục điện thoại: ẩn/hiện bảng màu và công cụ */
function closePanels(){$('#pal').classList.remove('open');$('#bar').classList.remove('open')}
function togglePanel(id){const on=!$('#'+id).classList.contains('open');closePanels();if(on)$('#'+id).classList.add('open')}
paint.addEventListener('pointerdown',()=>{if(matchMedia('(max-width:980px)').matches)closePanels()});

// Khởi tạo
render();stat();loadCursors();
const sv0=LS.get('btm-save',null);
if(sv0&&sv0.art){pend=sv0.paint;loadArt(sv0.art)}else loadArt(uri(ART[0][1]));
</script>
